name: Scrape ED wait times

on:
  # Scheduled runs are paused: GitHub's runner IPs get bot-verification
  # challenges (Vercel Security Checkpoint / Cloudflare) from the NHG and
  # SKH sites, so only NUHS ever came back "ok" from here. A local cron
  # job on a residential IP now runs scrape.py every 15 minutes instead
  # and gets all five sources. Kept as workflow_dispatch for manual/backup
  # runs — re-add a `schedule:` block if you ever move off local cron.
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run scraper
        run: python scrape.py

      - name: Commit updated data if changed
        run: |
          git config user.name "ed-wait-scraper-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/wait-times.json
          git diff --staged --quiet || git commit -m "Update ED wait times [skip ci]"
          git push
