name: Scrape ED wait times

on:
  schedule:
    # Every 30 minutes. GitHub does not guarantee exact timing — during
    # busy periods on the free tier, runs can be delayed by several
    # minutes. That's a platform limit, not a bug in this workflow.
    - cron: "*/30 * * * *"
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run scraper
        run: python scrape.py

      - name: Commit updated data if changed
        run: |
          git config user.name "ed-wait-scraper-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/wait-times.json
          git diff --staged --quiet || git commit -m "Update ED wait times [skip ci]"
          git push
